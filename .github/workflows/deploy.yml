name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (build-first, restart-only-on-success)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            APP_PATH="${{ secrets.ORACLE_APP_PATH }}"
            PM2_APP="${{ secrets.ORACLE_PM2_APP }}"

            if [ ! -d "$APP_PATH" ]; then
              echo "ERROR: repo path not found: $APP_PATH"
              exit 1
            fi
            cd "$APP_PATH"

            echo "== git pull =="
            git fetch origin main
            git reset --hard origin/main

            echo "== install deps =="
            pnpm install --frozen-lockfile

            echo "== db migrate =="
            pnpm run db:migrate

            echo "== build (memory-capped, per SPEC-ORACLE-HOSTING-001 OOM history) =="
            NODE_OPTIONS=--max-old-space-size=3072 pnpm run build

            echo "== copy static assets into standalone output (Next.js standalone mode does not do this automatically) =="
            rm -rf .next/standalone/.next/static .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
            if [ -d public ]; then cp -r public .next/standalone/public; fi

            echo "== verify pm2 app exists before restart =="
            if ! pm2 describe "$PM2_APP" > /dev/null 2>&1; then
              echo "ERROR: pm2 app '$PM2_APP' not found. Current apps:"
              pm2 list
              exit 1
            fi

            echo "== restart (build already succeeded, safe to restart) =="
            pm2 restart "$PM2_APP"
            pm2 save

            echo "== smoke check: public entry point (/) — bounded retry, no blind sleep =="
            # B2C 전환(SPEC-B2C-FOUNDATION-001)으로 /login은 삭제됐다. 배포 직후
            # Next.js가 아직 요청을 받을 준비가 안 됐을 수 있으므로, 무한정 기다리는
            # 대신 최대 10회 x 2초(20초) 재시도 후 실패로 확정한다.
            SMOKE_URL="http://127.0.0.1:3000/"
            HTTP_CODE="000"
            for attempt in $(seq 1 10); do
              HTTP_CODE=$(curl -s -o /tmp/smoke-body.html -w "%{http_code}" --max-time 5 "$SMOKE_URL" || echo "000")
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                break
              fi
              echo "  attempt ${attempt}/10: GET ${SMOKE_URL} -> HTTP ${HTTP_CODE} (retry in 2s)"
              sleep 2
            done
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "ERROR: smoke check failed — GET ${SMOKE_URL} did not return 2xx after 10 attempts (last status: ${HTTP_CODE})"
              exit 1
            fi
            echo "OK: GET ${SMOKE_URL} responded ${HTTP_CODE}"

            echo "== smoke check: placeholder page content =="
            if ! grep -q "서비스 준비 중입니다" /tmp/smoke-body.html; then
              echo "ERROR: smoke check failed — expected text '서비스 준비 중입니다' not found in ${SMOKE_URL} HTML"
              exit 1
            fi
            echo "OK: placeholder text present in ${SMOKE_URL}"

            echo "== smoke check: static asset actually served (catches missing standalone copy) =="
            CSS_PATH=$(grep -oE '/_next/static/chunks/[^"]+\.css' /tmp/smoke-body.html | head -1)
            if [ -z "$CSS_PATH" ]; then
              echo "ERROR: smoke check failed — no CSS chunk reference found in ${SMOKE_URL} HTML"
              exit 1
            fi
            CSS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:3000${CSS_PATH}")
            if [ "$CSS_CODE" -lt 200 ] || [ "$CSS_CODE" -ge 300 ]; then
              echo "ERROR: smoke check failed — GET ${CSS_PATH} returned HTTP ${CSS_CODE} (expected 2xx)"
              exit 1
            fi
            echo "OK: GET ${CSS_PATH} responded ${CSS_CODE}"

            echo "== informational only: confirm removed B2B routes stay gone (does NOT fail deploy) =="
            for removed_path in /login /cases/new; do
              REMOVED_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:3000${removed_path}")
              echo "  GET ${removed_path} -> HTTP ${REMOVED_CODE} (expected 404; informational, not a deploy gate)"
            done
