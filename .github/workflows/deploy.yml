name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (build-first, restart-only-on-success)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            APP_PATH="${{ secrets.ORACLE_APP_PATH }}"
            PM2_APP="${{ secrets.ORACLE_PM2_APP }}"

            if [ ! -d "$APP_PATH" ]; then
              echo "ERROR: repo path not found: $APP_PATH"
              exit 1
            fi
            cd "$APP_PATH"

            echo "== git pull =="
            git fetch origin main
            git reset --hard origin/main

            echo "== install deps =="
            pnpm install --frozen-lockfile

            echo "== db migrate =="
            pnpm run db:migrate

            echo "== build (memory-capped, per SPEC-ORACLE-HOSTING-001 OOM history) =="
            NODE_OPTIONS=--max-old-space-size=3072 pnpm run build

            echo "== verify pm2 app exists before restart =="
            if ! pm2 describe "$PM2_APP" > /dev/null 2>&1; then
              echo "ERROR: pm2 app '$PM2_APP' not found. Current apps:"
              pm2 list
              exit 1
            fi

            echo "== restart (build already succeeded, safe to restart) =="
            pm2 restart "$PM2_APP"
            pm2 save

            echo "== smoke check =="
            sleep 3
            curl -fsS -o /dev/null http://127.0.0.1:3000/login && echo "OK: /login responded 2xx"
