name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (build-first, restart-only-on-success)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            APP_PATH="${{ secrets.ORACLE_APP_PATH }}"
            PM2_APP="${{ secrets.ORACLE_PM2_APP }}"

            if [ ! -d "$APP_PATH" ]; then
              echo "ERROR: repo path not found: $APP_PATH"
              exit 1
            fi
            cd "$APP_PATH"

            echo "== git pull =="
            git fetch origin main
            git reset --hard origin/main

            echo "== install deps =="
            pnpm install --frozen-lockfile

            echo "== db migrate =="
            pnpm run db:migrate

            echo "== build (memory-capped, per SPEC-ORACLE-HOSTING-001 OOM history) =="
            NODE_OPTIONS=--max-old-space-size=3072 pnpm run build

            echo "== copy static assets into standalone output (Next.js standalone mode does not do this automatically) =="
            rm -rf .next/standalone/.next/static .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
            if [ -d public ]; then cp -r public .next/standalone/public; fi

            echo "== verify pm2 app exists before restart =="
            if ! pm2 describe "$PM2_APP" > /dev/null 2>&1; then
              echo "ERROR: pm2 app '$PM2_APP' not found. Current apps:"
              pm2 list
              exit 1
            fi

            echo "== restart (build already succeeded, safe to restart) =="
            pm2 restart "$PM2_APP"
            pm2 save

            echo "== smoke check: repository script (diagnosis gate closed or open both accepted) =="
            # 검사 로직은 저장소 스크립트에 있다(SPEC-B2C-LAUNCH-001 D-LAUNCH-06).
            # 판정은 홈 응답이 2xx이고 본문이 가리키는 CSS 청크가 서빙되는지뿐이며,
            # 진단 게이트가 닫혀 있든 열려 있든 같은 규칙이다(게이트 상태는 출력만 한다).
            # 재시도 횟수·대기는 스크립트의 기본값이 정한다. 스크립트가 0이 아닌 코드로
            # 끝나면 set -e로 이 배포 단계가 실패한다. 기준 주소는 인자로만 넘긴다.
            SMOKE_BASE_URL="http://127.0.0.1:3000"
            pnpm exec tsx scripts/smoke-check.ts --base-url="$SMOKE_BASE_URL"

            echo "== informational only: confirm removed B2B routes stay gone (does NOT fail deploy) =="
            for removed_path in /login /cases/new; do
              REMOVED_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
                "http://127.0.0.1:3000${removed_path}") || REMOVED_CODE="000"
              if [ "$REMOVED_CODE" = "000" ]; then
                echo "  GET ${removed_path} -> transport failure (curl could not complete the request; informational, not a deploy gate)"
              else
                echo "  GET ${removed_path} -> HTTP ${REMOVED_CODE} (expected 404; informational, not a deploy gate)"
              fi
            done
